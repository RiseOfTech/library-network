spring:
  application:
    name: library-network
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USER:library}
    password: ${DB_PASSWORD:library}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

library:
  readers:
    # Keys are lower case; the API category code is the key in upper case (adult -> ADULT).
    categories:
      adult:
        loan-limit: 5
        loan-period-days: 21
      student:
        loan-limit: 10
        loan-period-days: 30
      child:
        loan-limit: 3
        loan-period-days: 14
        max-age-exclusive: 14

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
